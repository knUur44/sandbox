# separate terms of service, privacy policy, and support
# documentation.

name: Psalm Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The published Psalm image runs PHP 8.4. This lockfile is PHP 7,
      # so the action's own composer install exits before writing results.sarif.
      - name: Psalm Security Scan
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            ghcr.io/psalm/psalm-security-scan \
            -lc 'composer install --no-scripts --no-progress --ignore-platform-reqs && /composer/vendor/bin/psalm --output-format=github --taint-analysis --report=results.sarif || test -s results.sarif'

      - name: Upload Security Analysis results to GitHub
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
