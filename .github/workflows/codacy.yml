name: Codacy Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No Codacy token: the action runs the open-source tools that have a default config.
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@6f415a0d3790c227a9cff580098545188e0f4e5a
        with:
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      # Codacy puts every tool in one SARIF file with the same category.
      # Code scanning rejects that upload, so each tool gets its own category.
      - name: Split Codacy tools into separate categories
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path

          path = Path("results.sarif")
          data = json.loads(path.read_text())
          used = set()
          for run in data.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              raw = driver.get("name") or "tool"
              slug = "".join(ch if ch.isalnum() else "-" for ch in raw).strip("-").lower() or "tool"
              category = slug
              n = 2
              while category in used:
                  category = f"{slug}-{n}"
                  n += 1
              used.add(category)
              run["automationDetails"] = {"id": f"codacy/{category}/"}
          path.write_text(json.dumps(data))
          print("categories:", ", ".join(sorted(used)))
          PY

      - name: Upload Codacy scan results to GitHub Security tab
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
