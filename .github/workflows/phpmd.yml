# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# PHPMD is a PHP code-quality linter. The codesize ruleset looks for
# complexity and size problems, not known vulnerabilities.

name: PHPMD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  PHPMD:
    name: Run PHPMD scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: phpmd

      # setup-php installs PHPMD 3. The old positional CLI never writes a report:
      # it treats the path as a command name and exits before phpmd-results.sarif exists.
      - name: Run PHPMD
        run: |
          phpmd analyze \
            --format sarif \
            --ruleset codesize \
            --reportfile-sarif phpmd-results.sarif \
            -- src public views config \
          || test -s phpmd-results.sarif

      - name: Upload analysis results to GitHub
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: phpmd-results.sarif
          wait-for-processing: true
