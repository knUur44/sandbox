# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Bearer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bearer:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Bearer SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Local CLI scan. A Bearer Cloud key is optional and not required for SARIF output.
      - name: Run Bearer
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          format: sarif
          output: results.sarif
          exit-code: 0

      - name: Upload Bearer scan results to GitHub Security tab
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
